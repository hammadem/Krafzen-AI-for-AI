services:
  # Production API
  - type: web
    name: krafzen-api-prod
    env: python
    buildCommand: bash render_build_native.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: SECRET_KEY
        sync: false
    healthCheckPath: /health
    plan: starter  # Free tier for MVP

  # Staging API
  - type: web
    name: krafzen-api-staging
    env: python
    buildCommand: bash render_build_native.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: staging
      - key: SENTRY_DSN
        sync: false
      - key: SECRET_KEY
        sync: false
    healthCheckPath: /health
    plan: starter  # Free tier for MVP
