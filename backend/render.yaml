services:
  # Production API
  - type: web
    name: krafzen-api-prod
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        sync: false
    healthCheckPath: /health/
    plan: starter  # Free tier for MVP

  # Staging API
  - type: web
    name: krafzen-api-staging
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: staging
      - key: SENTRY_DSN
        sync: false
    healthCheckPath: /health/
    plan: starter  # Free tier for MVP

