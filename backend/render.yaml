services:
  # Production API (Docker — ODA via apt/dpkg + Qt headless, same as local Docker)
  - type: web
    name: krafzen-api-prod
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: SECRET_KEY
        sync: false
      # ODA at Docker build time (Render passes these to docker build):
      - key: DWG_ODA_DEB_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ODA_BUCKET
        sync: false
      - key: R2_ODA_OBJECT_KEY
        sync: false
      - key: DWG_CONVERTER_CMD
        value: ODAFileConverter
      - key: DWG_CONVERTER_TYPE
        value: ODA

  # Staging API
  - type: web
    name: krafzen-api-staging
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: staging
      - key: SENTRY_DSN
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DWG_ODA_DEB_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ODA_BUCKET
        sync: false
      - key: R2_ODA_OBJECT_KEY
        sync: false
      - key: DWG_CONVERTER_CMD
        value: ODAFileConverter
      - key: DWG_CONVERTER_TYPE
        value: ODA
