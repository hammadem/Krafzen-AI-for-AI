name: Deploy Backend to Render

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests (if available)
      run: |
        cd backend
        python -m pytest app/tests/ -v || echo "No tests yet"
      continue-on-error: true
    
    - name: Lint code
      run: |
        cd backend
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Linting completed with warnings"
      continue-on-error: true

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Staging
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID_STAGING: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
      run: |
        echo "Deploying to staging environment"
        echo "Staging service ID: $RENDER_SERVICE_ID_STAGING"
    
    - name: Test staging health endpoint
      run: |
        sleep 10
        curl -f ${{ secrets.RENDER_STAGING_URL }}/health/ || echo "Staging health check failed - service may be starting"
        curl -f ${{ secrets.RENDER_STAGING_URL }}/health/detailed || echo "Staging detailed health check failed"

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Production
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID_PRODUCTION: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
      run: |
        echo "Deploying to production environment"
        echo "Production service ID: $RENDER_SERVICE_ID_PRODUCTION"
    
    - name: Test production health endpoint
      run: |
        sleep 10
        curl -f ${{ secrets.RENDER_PRODUCTION_URL }}/health/ || echo "Production health check failed - service may be starting"
        curl -f ${{ secrets.RENDER_PRODUCTION_URL }}/health/detailed || echo "Production detailed health check failed"

