name: Deploy Backend to Render

# Note: Tests run in test-backend.yml workflow
# This workflow only handles deployment after tests pass

# Deploy only on push to main/staging (includes when a PR is merged into those branches)
on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backend tests
      run: |
        cd backend
        python -m pytest -q

  deploy-staging:
    needs: backend-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Staging
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID_STAGING: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
      run: |
        echo "Deploying to staging environment"
        echo "Staging service ID: $RENDER_SERVICE_ID_STAGING"
    
    - name: Test staging health endpoint
      run: |
        for attempt in {1..30}; do
          if curl -fsS ${{ secrets.RENDER_STAGING_URL }}/health/dwg >/dev/null && \
             curl -fsS ${{ secrets.RENDER_STAGING_URL }}/openapi.json | grep -q '"/api/v1/exports/"'; then
            exit 0
          fi
          sleep 10
        done
        echo "Staging deployment did not expose Week 2 routes with a ready DWG runtime"
        exit 1

  deploy-production:
    needs: backend-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: Production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Production
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID_PRODUCTION: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
      run: |
        echo "Deploying to production environment"
        echo "Production service ID: $RENDER_SERVICE_ID_PRODUCTION"
    
    - name: Test production health endpoint
      run: |
        for attempt in {1..30}; do
          if curl -fsS ${{ secrets.RENDER_PRODUCTION_URL }}/health/dwg >/dev/null && \
             curl -fsS ${{ secrets.RENDER_PRODUCTION_URL }}/openapi.json | grep -q '"/api/v1/exports/"'; then
            exit 0
          fi
          sleep 10
        done
        echo "Production deployment did not expose Week 2 routes with a ready DWG runtime"
        exit 1
