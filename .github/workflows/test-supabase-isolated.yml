name: Isolated Supabase Auth, Storage and AEC reference tests

# No remote database credentials, cloud project ID or environment variables.
# Every runner starts fresh Docker containers and destroys them on exit.
on:
  push:
    branches:
      - "test/**"
      - "fix/**"
    paths:
      - "supabase/**"
      - "backend/scripts/verify_local_supabase_stack.py"
      - "backend/scripts/generate_aec_reference_dxf.py"
      - "backend/tests/fixtures/aec_reference/**"
      - ".github/workflows/test-supabase-isolated.yml"
  pull_request:
    branches:
      - "fix/**"
      - main
    paths:
      - "supabase/**"
      - "backend/scripts/verify_local_supabase_stack.py"
      - "backend/scripts/generate_aec_reference_dxf.py"
      - "backend/tests/fixtures/aec_reference/**"
      - ".github/workflows/test-supabase-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase:
    name: "Real local Supabase: Postgres, Auth, REST and private Storage"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source; never link to a remote project
        uses: actions/checkout@v4

      - name: Install official Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check local Supabase CLI version and available Docker
        run: |
          set -euo pipefail
          supabase --version
          docker info >/dev/null

      - name: Start isolated local Auth, Data API, Storage and Postgres
        run: |
          set -euo pipefail
          # Exclude unnecessary heavy services; keep auth, PostgREST, storage.
          # Starts and applies ALL repository migrations on an empty Postgres.
          supabase start -x studio,imgproxy,realtime,logflare,vector,mailpit,edge-runtime,postgres-meta,supavisor
          supabase status --output json > "$RUNNER_TEMP/local-supabase.json"
          test -s "$RUNNER_TEMP/local-supabase.json"

      - name: Verify full migration bootstrap, private storage and auth
        env:
          LOCAL_SUPABASE_STATUS_FILE: ${{ runner.temp }}/local-supabase.json
        run: |
          set -euo pipefail
          python -m pip install requests==2.32.3 psycopg2-binary==2.9.10
          python backend/scripts/verify_local_supabase_stack.py

      - name: Stop and delete the ephemeral local Supabase stack
        if: always()
        run: |
          # No production/staging cloud resource is touched.
          supabase stop --no-backup || true
