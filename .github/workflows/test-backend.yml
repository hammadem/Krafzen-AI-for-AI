name: Test Backend

# Main test workflow for backend
# Runs unit tests, integration tests (HTTP requests), linting, and validation
# Used by deploy-backend.yml workflow (tests must pass before deployment)

on:
  push:
    branches:
      - main
      - staging
      - feature/*
      - 'fix/**'
    paths:
      - 'backend/**'
      - 'supabase/migrations/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches:
      - main
      - staging
      - 'fix/**'
    paths:
      - 'backend/**'
      - 'supabase/migrations/**'
      - '.github/workflows/test-backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pip install flake8
    
    - name: Install native DXF tracer for real conversion smoke test
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y potrace

    - name: Lint code
      run: |
        cd backend
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Test imports
      run: |
        cd backend
        python -c "import main; print('✅ Main module imports successfully')"
        python -c "from app.api.health import router; print('✅ Health module imports successfully')"
        python -c "from app.services.supabase_service import supabase_service; print('✅ Supabase service imports successfully')"
    
    - name: Require successful HTTP startup and API documentation
      shell: bash
      run: |
        set -Eeuo pipefail
        cd backend
        python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/krafzen_ci_uvicorn.log 2>&1 &
        SERVER_PID=$!
        trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

        # This probe verifies the HTTP server without requiring live Supabase
        # secrets. Deployment readiness and /health/ready are separate gates.
        HTTP_READY=0
        for attempt in {1..15}; do
          if curl --fail --silent --show-error --max-time 2 \
            http://127.0.0.1:8000/openapi.json \
            -o /tmp/krafzen_ci_openapi.json 2>/dev/null; then
            HTTP_READY=1
            break
          fi
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Uvicorn exited before HTTP startup:"
            cat /tmp/krafzen_ci_uvicorn.log
            exit 1
          fi
          sleep 1
        done
        if [ "$HTTP_READY" -ne 1 ]; then
          echo "HTTP startup timed out:"
          cat /tmp/krafzen_ci_uvicorn.log
          exit 1
        fi
        curl --fail --silent --show-error --max-time 5 \
          http://127.0.0.1:8000/docs -o /dev/null
        python - <<'PY'
        import json

        with open("/tmp/krafzen_ci_openapi.json", encoding="utf-8") as fh:
            api = json.load(fh)
        assert api.get("openapi"), "OpenAPI version missing"
        paths = api.get("paths", {})
        for required in (
            "/api/v1/jobs/", "/api/v1/files/", "/api/v1/projects/"
        ):
            assert required in paths, f"Missing live OpenAPI route: {required}"
        print("HTTP startup, /docs and OpenAPI routes verified")
        PY

    - name: Verify Jobs and Files routes are registered
      run: |
        cd backend
        # Inspect the FastAPI app directly. /health requires Supabase secrets
        # and should not be used as a readiness gate in credential-free CI.
        python - <<'PY'
        from app.main import app

        paths = {route.path for route in app.routes}
        for required in ("/api/v1/jobs/", "/api/v1/files/", "/api/v1/projects/"):
            assert required in paths, f"Missing registered API route: {required}"
        print("Jobs, files, and projects routes registered successfully")
        PY

    - name: Run backend tests
      run: |
        cd backend
        python -m pytest -q

  schema-smoke:
    name: Verify IFC migration on isolated PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: krafzen_ci
          POSTGRES_USER: krafzen_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U krafzen_ci -d krafzen_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install database test driver
        run: python -m pip install psycopg2-binary==2.9.10
      - name: Apply IFC migration twice and inspect resulting schema
        env:
          DATABASE_URL: postgresql://krafzen_ci:local_ci_only@127.0.0.1:5432/krafzen_ci
        run: python backend/scripts/verify_ifc_migration.py
      - name: Verify atomic payment webhook ledger and restricted RPC
        env:
          DATABASE_URL: postgresql://krafzen_ci:local_ci_only@127.0.0.1:5432/krafzen_ci
        run: python backend/scripts/verify_payment_webhook_migration.py

      - name: Verify project archive migration on isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://krafzen_ci:local_ci_only@127.0.0.1:5432/krafzen_ci
        run: python backend/scripts/verify_project_archive_migration.py

      - name: Verify branding RLS and zero-credit signup migration on isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://krafzen_ci:local_ci_only@127.0.0.1:5432/krafzen_ci
        run: python backend/scripts/verify_branding_signup_security_migration.py
