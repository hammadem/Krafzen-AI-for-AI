name: Test Backend

# Main test workflow for backend
# Runs unit tests, integration tests (HTTP requests), linting, and validation
# Used by deploy-backend.yml workflow (tests must pass before deployment)

on:
  push:
    branches:
      - main
      - staging
      - feature/*
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint code
      run: |
        cd backend
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Linting completed with warnings"
      continue-on-error: true
    
    - name: Test imports
      run: |
        cd backend
        python -c "import main; print('✅ Main module imports successfully')"
        python -c "from app.api.health import router; print('✅ Health module imports successfully')"
        python -c "from app.services.supabase_service import supabase_service; print('✅ Supabase service imports successfully')"
    
    - name: Test FastAPI startup
      run: |
        cd backend
        timeout 10s uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/health/ || echo "Health check failed"
        curl -f http://localhost:8000/health/detailed || echo "Detailed health check failed"
    
    - name: Test API documentation
      run: |
        cd backend
        timeout 10s uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/docs || echo "API docs check failed"
    
    - name: Verify Jobs and Files routes are registered
      run: |
        cd backend
        timeout 10s uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        # Wait for server to be fully ready
        for i in {1..10}; do
          if curl -f http://localhost:8000/health > /dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        # Check OpenAPI JSON for actual endpoint paths (most reliable)
        OPENAPI_JSON=$(curl -s http://localhost:8000/openapi.json)
        # Check for Jobs endpoints
        if echo "$OPENAPI_JSON" | grep -q '"/api/v1/jobs'; then
          echo "✅ Jobs routes found"
        else
          echo "❌ Jobs routes not found - /api/v1/jobs endpoint missing"
          exit 1
        fi
        # Check for Files endpoints
        if echo "$OPENAPI_JSON" | grep -q '"/api/v1/files'; then
          echo "✅ Files routes found"
        else
          echo "❌ Files routes not found - /api/v1/files endpoint missing"
          exit 1
        fi
    
    - name: Run backend tests
      run: |
        cd backend
        python -m pytest -q
