name: Test Backend

# Main test workflow for backend
# Runs unit tests, integration tests (HTTP requests), linting, and validation
# Used by deploy-backend.yml workflow (tests must pass before deployment)

on:
  push:
    branches:
      - main
      - staging
      - feature/*
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint code
      run: |
        cd backend
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Linting completed with warnings"
      continue-on-error: true
    
    - name: Test imports
      run: |
        cd backend
        python -c "import main; print('✅ Main module imports successfully')"
        python -c "from app.api.health import router; print('✅ Health module imports successfully')"
        python -c "from app.services.supabase_service import supabase_service; print('✅ Supabase service imports successfully')"
    
    - name: Test FastAPI startup
      run: |
        cd backend
        timeout 10s uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/health/ || echo "Health check failed"
        curl -f http://localhost:8000/health/detailed || echo "Detailed health check failed"
    
    - name: Test API documentation
      run: |
        cd backend
        timeout 10s uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/docs || echo "API docs check failed"
    
    - name: Verify Jobs and Files routes are registered
      run: |
        cd backend
        timeout 10s uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        # Check OpenAPI JSON for route tags (more reliable than HTML)
        if curl -s http://localhost:8000/openapi.json | grep -q '"tags":\["Jobs"\]'; then
          echo "✅ Jobs routes found"
        else
          echo "❌ Jobs routes not found"
          exit 1
        fi
        if curl -s http://localhost:8000/openapi.json | grep -q '"tags":\["Files"\]'; then
          echo "✅ Files routes found"
        else
          echo "❌ Files routes not found"
          exit 1
        fi
    
    - name: Run unit tests
      run: |
        cd backend
        python -m pytest app/tests/test_jobs.py app/tests/test_files.py app/tests/test_health.py app/tests/test_projects.py -v --tb=short
      continue-on-error: true
    
    - name: Run integration tests (HTTP requests)
      run: |
        cd backend
        # Start server in background
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/server.log 2>&1 &
        SERVER_PID=$!
        echo "Server PID: $SERVER_PID"
        
        # Wait for server to start (max 30 seconds)
        echo "Waiting for server to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/health > /dev/null 2>&1; then
            echo "✅ Server started successfully after ${i} seconds"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "❌ Server failed to start"
            cat /tmp/server.log || true
            exit 1
          fi
          sleep 1
        done
        
        # Run integration tests
        echo "Running integration tests..."
        python -m pytest app/tests/test_integration.py -v --tb=short
        
        # Cleanup: Stop server
        echo "Stopping server..."
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true
        echo "✅ Server stopped"
      continue-on-error: true