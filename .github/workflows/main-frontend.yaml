# Not fully ready yet

name: Lint, Test, Build & Deploy Frontend (Production)

# Deploy only on push to main (includes when a PR is merged into main)
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'vercel.json'

jobs:
  production-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd frontend
          npm i

      - name: Run lint check
        run: |
          cd frontend
          npm run lint

      - name: Run tests
        run: |
          cd frontend
          npm run test -- --run

      - name: Build project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cd frontend
          npm run build

        # This is to check if the secrets are availaible in the provided repo
      - name: Debug Vercel secrets
        run: |
          echo "VERCEL_TOKEN set? ${{ secrets.VERCEL_TOKEN != '' }}"
          echo "VERCEL_ORG_ID set? ${{ secrets.VERCEL_ORG_ID != '' }}"
          echo "VERCEL_PROJECT_ID set? ${{ secrets.VERCEL_PROJECT_ID != '' }}"

      - name: Deploy to Vercel (Production)
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Run from repo root (vercel.json lives here)
          cd "$GITHUB_WORKSPACE"
          # 1. Install CLI
          npm install -g vercel

          # 2. Do NOT create .vercel – CLI uses VERCEL_ORG_ID + VERCEL_PROJECT_ID env vars
          # Creating .vercel/project.json causes "Could not retrieve Project Settings" in CI
          echo "🧹 Removing any .vercel link..."
          rm -rf .vercel frontend/.vercel

          # 3. Hide .git so CLI doesn't complain
          echo "🙈 Hiding .git directory..."
          mv .git .git_temp

          # 4. Deploy; pass env vars so CLI links project without reading .vercel
          echo "🚀 Deploying to Production..."
          VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" vercel deploy --prod --token="$VERCEL_TOKEN" --yes

          # 5. Restore .git
          mv .git_temp .git
          echo "✅ Production deployment complete"


