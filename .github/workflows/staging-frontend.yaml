name: Lint, Test, Build & Deploy Frontend (Staging)

# Deploy only on push to staging (includes when a PR is merged into staging)
on:
  push:
    branches:
      - staging
    paths:
      - 'frontend/**'
      - 'vercel.json'

jobs:
  staging-deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd frontend
          npm i

      - name: Run lint check
        run: |
          cd frontend
          npm run lint

      - name: Run tests
        run: |
          cd frontend
          npm run test -- --run

      - name: Build project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cd frontend
          npm run build

      # Optional debugging of Vercel secrets
      - name: Debug Vercel secrets
        run: |
          echo "VERCEL_TOKEN set? ${{ secrets.VERCEL_TOKEN != '' }}"
          echo "VERCEL_ORG_ID set? ${{ secrets.VERCEL_ORG_ID != '' }}"
          echo "VERCEL_PROJECT_ID set? ${{ secrets.VERCEL_PROJECT_ID != '' }}"

      - name: Deploy to Vercel (Custom Script)
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_PROJECT_ID, VERCEL_ORG_ID, and VERCEL_TOKEN must be set in GitHub Settings → Environments → staging → Environment secrets"
            exit 1
          fi

          # 1. Install CLI
          npm install -g vercel

          # 2. No .vercel – use env vars + --project so CLI does not call retrieve project settings
          echo "🧹 Ensuring no .vercel link..."
          rm -rf .vercel frontend/.vercel

          # 3. Hide .git
          echo "🙈 Hiding .git directory..."
          mv .git .git_temp

          # 4. Export and deploy with --project to skip project lookup
          export VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN
          echo "🚀 Deploying to Vercel..."
          vercel deploy --token="$VERCEL_TOKEN" --yes --project="$VERCEL_PROJECT_ID"

          # 5. Restore .git
          mv .git_temp .git
          echo "✅ Deployment complete"
